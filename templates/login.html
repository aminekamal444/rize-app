<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIZE — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
        <h1 class="logo">RIZE</h1>
        <a href="/signup" class="nav-login">Sign Up</a>
    </nav>

    <section class="auth-section">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-sub">Login to continue your glow up</p>

            <button class="btn-google" disabled>
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20"/>
                Continue with Google
            </button>

            <div class="divider"><span>or</span></div>

            <form class="auth-form" action="/login" method="POST">
                <input type="email" name="email" placeholder="Email address" required />
                <input type="password" name="password" placeholder="Password" required />
                <button type="submit" class="btn">Login</button>
            </form>

            {% if error %}
            <p style="color: #ff4444; font-size: 14px; margin-top: 16px;">{{ error }}</p>
            {% endif %}

            <p class="auth-link">Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
    </section>

</body>
</html>
