{% extends "shared/layout.html" %}

{% block title %}RIZE — Language{% endblock %}

{% block nav_right %}{% endblock %}

{% block content %}
<section class="onboarding-section">
    <div class="onboarding-container">

        <div class="onboarding-step-tag">01 / 05</div>

        <div class="onboarding-header">
            <h2>{{ t('onboarding.language.title') }}</h2>
        </div>

        <form method="POST" action="{{ url_for('onboarding_language_post') }}">
            <div class="lang-cards">

                <button type="submit" name="language" value="fr" class="lang-card {% if get_language() == 'fr' %}lang-card--active{% endif %}">
                    <span class="lang-card-code">FR</span>
                    <span class="lang-card-name">Français</span>
                    <span class="lang-card-sub">Toutes les recommandations en français</span>
                </button>

                <button type="submit" name="language" value="en" class="lang-card {% if get_language() == 'en' %}lang-card--active{% endif %}">
                    <span class="lang-card-code">EN</span>
                    <span class="lang-card-name">English</span>
                    <span class="lang-card-sub">All recommendations in English</span>
                </button>

                <button type="submit" name="language" value="ar" class="lang-card {% if get_language() == 'ar' %}lang-card--active{% endif %}">
                    <span class="lang-card-code">AR</span>
                    <span class="lang-card-name">العربية</span>
                    <span class="lang-card-sub">جميع التوصيات باللغة العربية</span>
                </button>

            </div>
        </form>

    </div>
</section>
{% endblock %}
