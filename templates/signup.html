{% extends "shared/layout.html" %}

{% block title %}RIZE — Sign Up{% endblock %}

{% block nav_right %}
    <a href="{{ url_for('login') }}" class="nav-login">Login</a>
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Create Your Account</h2>
        <p class="auth-sub">Start your 30-day transformation</p>

        <button class="btn-google" disabled>
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20"/>
            Continue with Google
        </button>

        <div class="divider"><span>or</span></div>

        {% if error %}
        <div class="onboarding-error">{{ error }}</div>
        {% endif %}

        <form class="auth-form" action="{{ url_for('signup_post') }}" method="POST">
            <input type="email" name="email" placeholder="Email address" value="{{ email or '' }}" required />
            <input type="password" name="password" placeholder="Password (min 6 characters)" required />
            <input type="password" name="confirm_password" placeholder="Confirm password" required />
            <button type="submit" class="btn">Create Account</button>
        </form>

        <p class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</section>
{% endblock %}
