<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIZE — Face Scan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <h1 class="logo">RIZE</h1>
        <a href="/dashboard" class="nav-login">Back</a>
    </nav>

    <section class="form-section">
        <div class="form-container">
            <div class="form-header">
                <p class="hero-tag">📸 AI Face Scan</p>
                <h2>Upload Your Photo</h2>
                <p class="hero-sub">Our AI analyzes your face shape, skin tone and features automatically. Use a clear front-facing photo in good lighting.</p>
            </div>

            <form action="/scan" method="POST" enctype="multipart/form-data">
                <div class="upload-area" onclick="document.getElementById('photo').click()">
                    <input type="file" id="photo" name="photo" accept="image/*" style="display:none" onchange="previewImage(this)">
                    <div id="upload-placeholder">
                        <p style="font-size:48px;">📸</p>
                        <p style="color:#c9a84c; font-size:16px; margin-top:16px;">Click to upload photo</p>
                        <p style="color:#666; font-size:13px; margin-top:8px;">Front facing, good lighting, hair pulled back</p>
                    </div>
                    <img id="preview" style="display:none; width:100%; border-radius:12px; max-height:400px; object-fit:cover;">
                </div>

                <div class="form-group" style="margin-top:32px;">
                    <label>What do you want to improve?</label>
                    <div class="options-grid">
                        <label class="option"><input type="checkbox" name="improve" value="hair"><span>✂️ Hair & Beard</span></label>
                        <label class="option"><input type="checkbox" name="improve" value="style"><span>👔 Style</span></label>
                        <label class="option"><input type="checkbox" name="improve" value="skin"><span>🧴 Skin</span></label>
                        <label class="option"><input type="checkbox" name="improve" value="fitness"><span>💪 Fitness</span></label>
                    </div>
                </div>

                <button type="submit" class="btn" id="submit-btn" style="width:100%; border:none; cursor:pointer; margin-top:16px;" onclick="showLoading()">
                    Scan My Face ✨
                </button>
                <div id="loading" style="display:none; text-align:center; margin-top:24px;">
                    <p style="color:#c9a84c; font-size:16px; letter-spacing:2px;">ANALYZING YOUR FACE...</p>
                    <p style="color:#666666; font-size:14px; margin-top:8px;">AI is detecting your features ✨</p>
                </div>
            </form>
        </div>
    </section>

    <script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('upload-placeholder').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function showLoading() {
        setTimeout(function() {
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
        }, 100);
    }
    </script>
</body>
</html>
